<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thử cảnh quầy</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:16px;background:#f0e6c8;font-family:'Baloo 2',system-ui,sans-serif;color:#4a2a16;max-width:900px;margin-inline:auto}
button{font:inherit;font-weight:800;padding:6px 14px;border:3px solid #4a2a16;border-radius:12px;background:#8a5a3b;color:#fff;cursor:pointer;margin:10px 8px 10px 0}
#stats{font-weight:700}
</style>
</head>
<body>
<div id="shop-scene"></div>
<button id="open" type="button">Mở / đóng cửa</button>
<button id="rush" type="button">Thêm 5 khách (+2 người chê giá)</button>
<p id="stats">Đơn: <b id="n">0</b> · Doanh thu: <b id="rev">0đ</b></p>

<script src="js/shop-scene.js"></script>
<script>
const MENU = [
  {id:1, name:'trà sữa trân châu', emoji:'🧋', price:35000},
  {id:2, name:'matcha latte', emoji:'🍵', price:42000},
  {id:3, name:'trà đào', emoji:'🍑', price:30000},
  {id:4, name:'cà phê sữa', emoji:'☕', price:25000}
];
const NAMES = ['Lan','Minh','Hùng','Mai','Tuấn','Hà'];
let n = 0, rev = 0, id = 1, open = false;
const scene = ShopScene.mount(document.getElementById('shop-scene'), {
  emojiFor: pid => (MENU.find(m => m.id === pid) || {}).emoji || '🛍️',
  onSale: e => {
    n++; rev += e.revenue;
    document.getElementById('n').textContent = n;
    document.getElementById('rev').textContent = rev.toLocaleString('vi-VN') + 'đ';
  }
});
// Giả lập một dòng shop_orders như shop-tick.php trả về
function fakeOrder() {
  const m = MENU[Math.floor(Math.random() * MENU.length)], qty = 1 + Math.floor(Math.random() * 3);
  const missed = Math.random() < 0.2;
  return {id: id++, product_id: m.id, product_name: m.name, quantity: missed ? 0 : qty,
          total: missed ? 0 : m.price * qty, status: missed ? 'missed' : 'served',
          customer: 'Khách ' + NAMES[Math.floor(Math.random() * NAMES.length)]};
}
document.getElementById('open').onclick = () => { open = !open; scene.setOpen(open); };
document.getElementById('rush').onclick = () => { scene.push(Array.from({length: 5}, fakeOrder)); scene.walkBy(2); };
</script>
</body>
</html>
