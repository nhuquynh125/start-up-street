<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Street - Quản lý Kinh Doanh</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1, h2 { color: #2c3e50; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 4px solid #3498db; }
        .card h3 { margin-top: 0; color: #2980b9; }
        .card p { color: #7f8c8d; font-size: 14px; }
        .card .capital { font-weight: bold; color: #e74c3c; font-size: 16px; margin: 10px 0; }
        .btn { background: #2ecc71; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn:hover { background: #27ae60; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #34495e; color: white; }
        .section { background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏬 Quản Lý Cửa Hàng & Kho Hàng</h1>

    <!-- 1. CHỌN MÔ HÌNH KINH DOANH & TẠO CỬA HÀNG -->
    <div id="section-create-shop" class="section">
        <h2>1. Chọn Mô Hình Kinh Doanh</h2>
        <div id="business-types-list" class="card-grid">
            <p>Đang tải danh sách mô hình kinh doanh...</p>
        </div>

        <!-- FORM TẠO CỬA HÀNG -->
        <div id="create-shop-form" class="hidden">
            <hr>
            <h3>Tạo Cửa Hàng Mới Cho Mặt Bằng Đã Thuê</h3>
            <div class="form-group">
                <label>Loại hình đã chọn:</label>
                <input type="text" id="selected-type-name" disabled style="background: #eee;">
                <input type="hidden" id="selected-type-id">
            </div>
            <div class="form-group">
                <label>Tên cửa hàng của bạn:</label>
                <input type="text" id="shop-name" placeholder="Ví dụ: Trà Sữa Moon Tea">
            </div>
            <button class="btn" onclick="submitCreateShop()">Mở Cửa Hàng Ngay</button>
        </div>
    </div>

    <!-- 2. QUẢN LÝ SẢN PHẨM & KHO HÀNG -->
    <div id="section-inventory" class="section hidden">
        <h2 id="current-shop-title">2. Quản Lý Kho Hàng Cửa Hàng</h2>
        
        <h3>Danh Sách Sản Phẩm & Tồn Kho</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên Sản Phẩm</th>
                    <th>Giá Vốn (Gốc)</th>
                    <th>Giá Bán (Của Cửa Hàng)</th>
                    <th>Tồn Kho Hiện Tại</th>
                    <th>Thao Tác Nhập Hàng</th>
                </tr>
            </thead>
            <tbody id="inventory-table-body">
                <!-- Dữ liệu sản phẩm sẽ đổ vào đây -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Giả lập ID User và Mặt bằng đã thuê từ TV1 và TV2
    const CURRENT_USER_ID = 1;
    const RENTED_PROPERTY_ID = 101; 

    let currentShopId = null;

    // Load danh sách loại hình kinh doanh khi mở trang
    document.addEventListener("DOMContentLoaded", function() {
        loadBusinessTypes();
    });

    // 1. Lấy loại hình kinh doanh từ API (GET /api/business-types.php)
    function loadBusinessTypes() {
        fetch('/api/business-types.php')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    let html = '';
                    data.data.business_types.forEach(type => {
                        html += `
                            <div class="card">
                                <h3>${type.name}</h3>
                                <p>${type.description}</p>
                                <div class="capital">Vốn cần: ${Number(type.required_capital).toLocaleString()} VNĐ</div>
                                <button class="btn" onclick="selectBusinessType(${type.id}, '${type.name}')">Chọn Mô Hình</button>
                            </div>
                        `;
                    });
                    document.getElementById('business-types-list').innerHTML = html;
                }
            })
            .catch(err => console.error("Lỗi load business types:", err));
    }

    // Chọn loại hình kinh doanh
    function selectBusinessType(typeId, typeName) {
        document.getElementById('selected-type-id').value = typeId;
        document.getElementById('selected-type-name').value = typeName;
        document.getElementById('create-shop-form').classList.remove('hidden');
    }

    // 2. Gửi request tạo cửa hàng (POST /api/create-shop.php)
    function submitCreateShop() {
        const typeId = document.getElementById('selected-type-id').value;
        const shopName = document.getElementById('shop-name').value;

        if (!shopName) {
            alert("Vui lòng nhập tên cửa hàng!");
            return;
        }

        fetch('/api/create-shop.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                owner_user_id: CURRENT_USER_ID,
                property_id: RENTED_PROPERTY_ID,
                business_type_id: typeId,
                name: shopName
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alert("Tạo cửa hàng thành công!");
                currentShopId = data.data.shop_id;
                
                // Mở khu vực quản lý kho hàng
                document.getElementById('section-inventory').classList.remove('hidden');
                document.getElementById('current-shop-title').innerText = `2. Quản Lý Kho Hàng: ${shopName}`;
                loadShopProducts(currentShopId);
            } else {
                alert("Lỗi: " + data.message);
            }
        });
    }

    // 3. Load danh sách sản phẩm và tồn kho (GET /api/get-shop-products.php)
    function loadShopProducts(shopId) {
        fetch(`/api/get-shop-products.php?shop_id=${shopId}`)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    let html = '';
                    data.data.products.forEach(p => {
                        html += `
                            <tr>
                                <td>${p.product_id}</td>
                                <td><b>${p.product_name}</b></td>
                                <td>${Number(p.base_cost).toLocaleString()} VNĐ</td>
                                <td>
                                    <input type="number" id="price-${p.product_id}" value="${p.selling_price}" style="width:100px;"> VNĐ
                                </td>
                                <td><span style="color:blue; font-weight:bold;">${p.stock_quantity}</span> cái</td>
                                <td>
                                    <input type="number" id="qty-${p.product_id}" value="10" min="1" style="width:60px;">
                                    <button onclick="purchaseInventory(${p.product_id})" style="background:#f39c12; color:white; border:none; padding:5px 10px; border-radius:3px; cursor:pointer;">Nhập Hàng</button>
                                </td>
                            </tr>
                        `;
                    });
                    document.getElementById('inventory-table-body').innerHTML = html;
                }
            });
    }

    // 4. Nhập hàng vào kho (POST /api/purchase-inventory.php)
    function purchaseInventory(productId) {
        const qty = document.getElementById(`qty-${productId}`).value;
        const sellingPrice = document.getElementById(`price-${productId}`).value;

        fetch('/api/purchase-inventory.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                shop_id: currentShopId,
                product_id: productId,
                quantity: parseInt(qty),
                selling_price: parseFloat(sellingPrice)
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alert("Nhập hàng thành công!");
                loadShopProducts(currentShopId); // Refresh lại bảng kho
            } else {
                alert("Lỗi: " + data.message);
            }
        });
    }
</script>

</body>
</html>
