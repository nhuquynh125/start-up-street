<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startup Street — Quầy pha chế</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--wood-d:#4a2a16;--wood:#8a5a3b;--wood-l:#b9835a;--paper:#f7e8c8;--paper-d:#e6cb98;--cream:#fff6dd;
 --ok:#6fb23f;--ok-d:#4c8a26;--no:#d95b4f;--no-d:#a63a31;--gold:#f2b441;--ink:#4a2a16;--font:'Baloo 2',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#f0e6c8;color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer}
.hud{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
 padding:8px 14px;background:var(--paper);border-bottom:4px solid var(--wood);font-weight:800}
.pill{background:var(--cream);border:3px solid var(--wood);border-radius:12px;padding:2px 12px;font-size:14px}
.btn{border:3px solid var(--wood-d);border-radius:12px;padding:6px 14px;font-weight:800;font-size:15px;color:#fff;
 background:var(--wood);box-shadow:0 4px 0 var(--wood-d);text-decoration:none;display:inline-block}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-d)}
.btn.ok{background:var(--ok);border-color:var(--ok-d);box-shadow:0 4px 0 var(--ok-d)}
.btn.no{background:var(--no);border-color:var(--no-d);box-shadow:0 4px 0 var(--no-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#notice{display:none;padding:10px 16px;background:#fff0c9;border-bottom:3px solid #e8a020;font-weight:700}
.game{display:grid;grid-template-columns:300px 1fr 220px;gap:14px;padding:14px;max-width:1200px;margin:0 auto}
.panel{background:var(--paper);border:4px solid var(--wood);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--wood-d)}
.panel h3{font-size:16px;margin-bottom:8px}
/* khách */
.ticket{background:var(--cream);border:3px solid var(--paper-d);border-radius:14px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.ticket.sel{border-color:var(--gold);box-shadow:0 0 0 3px #ffe08a}
.ticket .who{font-weight:800}.ticket .want{font-size:14px}
.bar{height:8px;background:#e6d8b8;border-radius:5px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:100%}
.empty{opacity:.6;text-align:center;padding:16px;font-weight:600}
/* quầy */
.row{margin-bottom:10px}.row h4{font-size:14px;margin-bottom:4px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{min-width:84px;border:3px solid var(--wood-l);border-radius:12px;background:var(--cream);padding:6px 8px;font-weight:700;font-size:14px;color:var(--ink)}
.opt[aria-pressed=true]{background:#ffe08a;border-color:#e19a1f}
.cupwrap{display:flex;gap:14px;align-items:center;margin:8px 0 12px}
.cup{position:relative;width:70px;height:96px;border:4px solid var(--wood-d);border-top-width:6px;border-radius:6px 6px 22px 22px;background:#fff9;overflow:hidden;flex-shrink:0}
.liquid{position:absolute;left:0;right:0;bottom:0;height:0;background:#ddd;transition:height .25s,background .25s}
.topping{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:20px;letter-spacing:-4px}
#cupText{font-weight:700;font-size:14px}
.stock{display:flex;justify-content:space-between;font-size:14px;font-weight:700;padding:4px 0;border-bottom:2px dashed var(--paper-d)}
.stock.out{color:var(--no-d)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--wood-d);color:var(--cream);padding:8px 20px;
 border-radius:14px;border:3px solid var(--wood-l);font-weight:800;display:none;z-index:50;max-width:90vw}
#overlay{position:fixed;inset:0;background:#2a160a99;display:none;align-items:center;justify-content:center;z-index:40}
#overlay .box{background:var(--paper);border:6px solid var(--wood);border-radius:22px;padding:22px;width:min(380px,92vw);text-align:center}
#overlay .box div{font-weight:700;margin:4px 0}
@media(max-width:900px){.game{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="hud">
  <span>🧋 <span id="shopName">Quầy pha chế</span></span>
  <span style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <span class="pill">⏱️ <b id="time">--</b></span>
    <span class="pill">⭐ <b id="rep">100</b></span>
    <span class="pill">Ca này: <b id="shiftRev">0đ</b></span>
    <span class="pill">💰 <b id="balance">…</b></span>
    <a class="btn" href="map.php">🗺️ Bản đồ</a>
  </span>
</header>
<div id="notice" role="status"></div>

<main class="game">
  <section class="panel">
    <h3>🛎️ Khách đang chờ</h3>
    <div id="queue"></div>
  </section>

  <section class="panel">
    <h3>🧋 Quầy pha chế</h3>
    <div class="row"><h4>1. Chọn cỡ ly</h4><div class="opts" id="sizes"></div></div>
    <div class="row"><h4>2. Chọn trà nền</h4><div class="opts" id="bases"></div></div>
    <div class="row"><h4>3. Chọn topping</h4><div class="opts" id="tops"></div></div>
    <div class="row"><h4>4. Độ ngọt</h4><div class="opts" id="sugars"></div></div>
    <div class="row"><h4>5. Đá</h4><div class="opts" id="ices"></div></div>
    <div class="cupwrap">
      <div class="cup"><div class="liquid" id="liquid"></div><div class="topping" id="topEmoji"></div></div>
      <div id="cupText">Ly trống</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn ok" id="serve" type="button">✅ Phục vụ khách đã chọn</button>
      <button class="btn no" id="trash" type="button">🗑️ Đổ ly</button>
    </div>
  </section>

  <section class="panel">
    <h3>📦 Kho nguyên liệu</h3>
    <div id="stocks"></div>
    <a class="btn" id="restock" href="business-management.html" style="margin-top:10px;font-size:14px">📥 Nhập hàng</a>
  </section>
</main>

<div id="toast" role="status"></div>
<div id="overlay"><div class="box">
  <h2 id="ovTitle">Hết ca!</h2>
  <div id="ovBody"></div>
  <button class="btn ok" id="newShift" type="button" style="margin-top:12px">▶ Ca mới</button>
</div></div>

<script src="js/shop-game.js"></script>
</body>
</html>
